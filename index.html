        // 全局变量
        let currentQ = 0;
        let score = {A:0,B:0,C:0,D:0};

        // DOM元素
        const homePage = document.getElementById('homePage');
        const testPage = document.getElementById('testPage');
        const resultPage = document.getElementById('resultPage');
        const startBtn = document.getElementById('startBtn');
        const nextBtn = document.getElementById('nextBtn');
        const resetBtn = document.getElementById('resetBtn');
        const shareBtn = document.getElementById('shareBtn');
        const questionTitle = document.getElementById('questionTitle');
        const optionBox = document.getElementById('optionBox');
        const progressBar = document.getElementById('progressBar');
        const progressNum = document.getElementById('progressNum');

        // 开始测试
        startBtn.addEventListener('click', () => {
            homePage.classList.add('hidden');
            testPage.classList.remove('hidden');
            renderQuestion();
        });

        // 渲染题目
        function renderQuestion() {
            const q = questionList[currentQ];
            questionTitle.innerText = `${currentQ+1}. ${q.q}`;
            optionBox.innerHTML = '';
            nextBtn.disabled = true;
            nextBtn.className = 'w-full mt-8 bg-gray-200 text-gray-400 py-3 rounded-xl text-[14px] font-medium transition-all disabled:cursor-not-allowed';

            // 渲染四个选项
            q.o.forEach((item, idx) => {
                const letter = ['A','B','C','D'][idx];
                const div = document.createElement('div');
                div.className = 'option-item border border-gray-200 rounded-xl p-4 text-[14px] transition-all active:scale-[0.99]';
                div.innerHTML = `<span class="font-medium mr-2 text-secondary">${letter}</span>${item}`;
                div.onclick = () => selectOption(div, letter);
                optionBox.appendChild(div);
            });

            // 更新进度
            const percent = ((currentQ+1)/50)*100;
            progressBar.style.width = `${percent}%`;
            progressNum.innerText = currentQ+1;
        }

        // 选择选项
        function selectOption(dom, type) {
            // 清除所有选中
            document.querySelectorAll('.option-item').forEach(el => el.classList.remove('option-active'));
            // 选中当前
            dom.classList.add('option-active');
            // 计分
            score[type]++;
            // 解锁下一题
            nextBtn.disabled = false;
            nextBtn.className = 'w-full mt-8 bg-secondary text-white py-3 rounded-xl text-[14px] font-medium transition-all hover:bg-secondary/90 active:scale-[0.98]';
        }

        // 下一题
        nextBtn.addEventListener('click', () => {
            currentQ++;
            if(currentQ >= 50) {
                getResult();
                return;
            }
            renderQuestion();
        });

        // 生成最终结果
        function getResult() {
            testPage.classList.add('hidden');
            resultPage.classList.remove('hidden');

            // 获取最高分人格
            let maxType = 'A';
            let maxScore = score.A;
            if(score.B>maxScore) {maxScore=score.B;maxType='B'}
            if(score.C>maxScore) {maxScore=score.C;maxType='C'}
            if(score.D>maxScore) {maxScore=score.D;maxType='D'}

            // 随机匹配对应人格的英雄（多样化结果）
            const filterHero = heroDB.filter(item => item.type === maxType);
            const randomHero = filterHero[Math.floor(Math.random()*filterHero.length)];
            const percent = Math.floor((maxScore/50)*100);

            // 填充数据
            document.getElementById('heroName').innerText = `匹配英雄：${randomHero.name}`;
            document.getElementById('heroTag').innerText = randomHero.tag;
            document.getElementById('matchPercent').innerText = `${percent}%`;
            document.getElementById('matchBar').style.width = `${percent}%`;
            document.getElementById('heroPersonality').innerText = randomHero.hPer;
            document.getElementById('selfPersonality').innerText = randomHero.sPer;
            document.getElementById('diffAnalysis').innerText = randomHero.diff;
            document.getElementById('psychAnalysis').innerText = randomHero.psy;
        }

        // 重新测试
        resetBtn.addEventListener('click', () => {
            currentQ = 0;
            score = {A:0,B:0,C:0,D:0};
            resultPage.classList.add('hidden');
            homePage.classList.remove('hidden');
            progressBar.style.width = '0%';
            progressNum.innerText = '0';
        });

        // 保存结果提示
        shareBtn.addEventListener('click', () => {
            alert('已生成专属测试结果！可长按页面截图保存~');
        });
    </script>
